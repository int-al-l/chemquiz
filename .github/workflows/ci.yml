name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # only what the site and tests need (the catalog pipeline deps are heavy)
      - run: pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "SQLAlchemy>=2.0" "pydantic>=2.7" "python-multipart>=0.0.9" "pytest>=8.0" "httpx>=0.27"
      - run: python -m pytest -q
